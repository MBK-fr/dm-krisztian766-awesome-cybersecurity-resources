name: Link Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429
            --timeout 20
            --retry-wait-time 5
            --max-retries 2
            README.md
          fail: true
